name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + unit tests (offline, no API key needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: pytest -q
        env: { PYTHONPATH: src:scripts }
      - name: smoke-test the committed model through the API
        env: { PYTHONPATH: src }
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from hybridmod.api import app
          with TestClient(app) as c:
              assert c.get("/healthz").json()["status"] == "ok"
              r = c.post("/v1/moderate", json={"text": "Thanks for the great article!"}).json()
              assert r["action"] == "allow", r
              r = c.post("/v1/moderate/batch", json={"comments": [{"text": "you are a pathetic idiot"}, {"text": "What time does the meeting start?"}]}).json()
              print(r["summary"]); assert r["results"][0]["flagged"] and not r["results"][1]["flagged"]
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hybridmod:ci .
      - run: |
          docker run -d --name mod -p 8000:8000 hybridmod:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf -X POST localhost:8000/v1/moderate -H 'content-type: application/json' -d '{"text":"great video, thanks"}'
